services:
  - type: web
    name: agente-atendimento-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: PORT
        sync: false
      - key: DJDECOR_API_URL
        sync: false
      - key: DJDECOR_API_TOKEN
        sync: false
